version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kompanion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kompanion
      POSTGRES_PASSWORD: kompanion_dev_password
      POSTGRES_DB: kompanion_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kompanion']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
